syntax = "proto3";
import "SerializableQueryId.proto";
import "SerializableQueryPlan.proto";
import "google/protobuf/empty.proto";

service WorkerRPCService {
  rpc StartQuery (StartQueryRequest) returns (StartQueryReply) {}
  rpc StopQuery (StopQueryRequest) returns (google.protobuf.Empty) {}

  /// Configures the drain of a query (phase 1). The query keeps running until the drain is started.
  rpc DrainQuery (DrainQueryRequest) returns (google.protobuf.Empty) {}
  /// Starts a configured drain at a query (phase 2). Returns once the sources have been told to drain; the query reports Drained once
  /// the drain has completed.
  rpc StartDrain (StartDrainRequest) returns (google.protobuf.Empty) {}
  /// Redirects a network sink, which buffers since its receiver was drained, to a new receiver.
  rpc RedirectSink (RedirectSinkRequest) returns (google.protobuf.Empty) {}

  rpc RequestQueryStatus (QueryStatusRequest) returns (QueryStatusReply) {}
  rpc RequestStatus (WorkerStatusRequest) returns (WorkerStatusResponse) {}
  rpc RequestVersion (google.protobuf.Empty) returns (VersionResponse) {}
}

message VersionResponse {
  string version = 1;
}

message StartQueryRequest {
  NES.SerializableQueryPlan queryPlan = 1;
}

message StartQueryReply {
  NES.SerializableQueryId queryId = 1;
}

message StopQueryRequest {
    NES.SerializableQueryId queryId = 1;
}

/// How a network sink ends its channel when its query is drained.
enum SinkDrainMode {
    /// The downstream query is drained as well: send a drain marker, then close the channel.
    SinkForwardMarker = 0;
    /// The downstream query keeps running: leave the channel without ending the stream.
    SinkDetach = 1;
    /// The query is not drained, but the downstream query is: buffer once the receiver detaches, until the sink is redirected.
    SinkBufferOnDetach = 2;
}

message DrainQueryRequest {
    NES.SerializableQueryId queryId = 1;
    uint64 drainId = 2;
    /// The query itself is drained. If false, it only takes part in the drain through sinks in BufferOnDetach mode.
    bool drainsQuery = 3;
    /// The drain starts at this query: StartDrain drains every source which is not listed in markerChannels.
    bool stopLocalSources = 4;
    /// The channel ids of the network sources which end with a marker from a drained upstream query.
    repeated string markerChannels = 5;
    /// The drain mode of network sinks, keyed by their channel id. Sinks without an entry close their channel as usual.
    map<string, SinkDrainMode> sinkModes = 6;
}

message StartDrainRequest {
    NES.SerializableQueryId queryId = 1;
    uint64 drainId = 2;
}

message RedirectSinkRequest {
    NES.SerializableQueryId queryId = 1;
    /// The channel id of the network sink.
    string channel = 2;
    /// The data address (host:port) of the new receiver.
    string connection = 3;
    /// The channel id of the network source the sink is redirected to.
    string newChannel = 4;
}

enum QueryState {
    Registered = 0;
    Started = 1;
    Running = 2;
    Stopped = 3;
    Failed = 4;
    Drained = 5;
}

message Error {
    uint64 code = 1;
    string message = 2;
    string stackTrace = 3; /// currently untyped
    string location = 4; /// currently untyped
}

message QueryStatusRequest {
  NES.SerializableQueryId queryId = 1;
}

message QueryMetrics {
   optional uint64 startUnixTimeInMs = 1;
   optional uint64 runningUnixTimeInMs = 2;
   optional uint64 stopUnixTimeInMs = 3;
   optional Error error = 4;
}

message QueryStatusReply {
    NES.SerializableQueryId queryId = 1;
    QueryState state = 2;
    QueryMetrics metrics = 3;
}

message WorkerStatusRequest {
  uint64 after_unix_timestamp_in_milli_seconds = 1;
}

message WorkerStatusResponse {
  message ActiveQuery {
    NES.SerializableQueryId query_id = 1;
    optional uint64 started_unix_timestamp_in_milli_seconds = 2;
  }

  message TerminatedQuery {
    NES.SerializableQueryId query_id = 1;
    optional uint64 started_unix_timestamp_in_milli_seconds = 2;
    uint64 terminated_unix_timestamp_in_milli_seconds = 3;
    optional Error error = 4;
  }

  uint64 after_unix_timestamp_in_milli_seconds = 3;
  uint64 until_unix_timestamp_in_milli_seconds = 4;
  repeated ActiveQuery active_queries = 1;
  repeated TerminatedQuery terminated_queries = 2;
}
